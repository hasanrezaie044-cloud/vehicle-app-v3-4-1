name: Build APK v3.4.2-fixes-1

on:
  workflow_dispatch:
  push:
    branches:
      - v3.4.2-fixes-1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild
        run: CI=1 npx expo prebuild --platform android

      - name: Check secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "Signing secrets OK"

      - name: Install keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/carmangment-release.jks
          test -s android/app/carmangment-release.jks
          echo "Keystore OK"

      - name: Configure signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY2'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # Remove all previously injected signingConfigs blocks
          while "signingConfigs {" in s:
              start = s.find("signingConfigs {")
              brace = s.find("{", start)
              depth = 0
              end = None

              for i in range(brace, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit("Could not remove signingConfigs block")

              s = s[:start] + s[end:]

          # Find android block
          android_pos = s.find("android {")
          if android_pos == -1:
              raise SystemExit("android block not found")

          signing = """
              signingConfigs {
                  release {
                      storeFile file("carmangment-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          insert_pos = android_pos + len("android {")
          s = s[:insert_pos] + signing + s[insert_pos:]

          # Find buildTypes block specifically
          buildtypes_pos = s.find("buildTypes {")
          if buildtypes_pos == -1:
              raise SystemExit("buildTypes block not found")

          # Find release AFTER buildTypes
          release_pos = s.find("release {", buildtypes_pos)
          if release_pos == -1:
              raise SystemExit("release build type not found")

          # Make sure this is actually the release build type
          insert_pos = release_pos + len("release {")

          s = (
              s[:insert_pos]
              + """
              signingConfig signingConfigs.release
              """
              + s[insert_pos:]
          )

          p.write_text(s)
          print("SIGNING CONFIGURED SUCCESSFULLY")
          PY2

      - name: Verify Gradle file
        run: |
          echo "===== SIGNING CONFIG ====="
          grep -n -A12 -B2 "signingConfigs" android/app/build.gradle || true
          echo "===== BUILD TYPES ====="
          grep -n -A15 -B2 "buildTypes" android/app/build.gradle || true
          echo "===== RELEASE SIGNING ====="
          grep -n "signingConfig" android/app/build.gradle || true
      - name: Verify Gradle file
        run: |
          grep -n -A12 -B2 "signingConfigs" android/app/build.gradle
          grep -n -A8 -B2 "signingConfig" android/app/build.gradle

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-app-v3.4.2-fixes-1-release-apk
          path: android/app/build/outputs/apk/release/*.apk
