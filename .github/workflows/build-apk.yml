name: Build APK v3.4.2-fixes-1

on:
  workflow_dispatch:
  push:
    branches:
      - v3.4.2-fixes-1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild
        run: CI=1 npx expo prebuild --platform android

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "Signing secrets OK"

      - name: Install release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/carmangment-release.jks
          test -s android/app/carmangment-release.jks
          echo "Keystore installed"

      - name: Verify release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore android/app/carmangment-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Configure Gradle release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          # Remove existing signingConfigs block
          marker = "signingConfigs {"
          while marker in s:
              start = s.find(marker)
              brace = s.find("{", start)
              depth = 0
              end = None

              for i in range(brace, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break

              if end is None:
                  raise SystemExit("Could not remove signingConfigs")

              s = s[:start] + s[end:]

          android_pos = s.find("android {")
          if android_pos == -1:
              raise SystemExit("android block not found")

          signing = '''
              signingConfigs {
                  release {
                      storeFile file("carmangment-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''

          insert = android_pos + len("android {")
          s = s[:insert] + signing + s[insert:]

          # Find release build type
          buildtypes = s.find("buildTypes {")
          if buildtypes == -1:
              raise SystemExit("buildTypes not found")

          release = s.find("release {", buildtypes)
          if release == -1:
              raise SystemExit("release build type not found")

          release_insert = release + len("release {")

          s = (
              s[:release_insert]
              + '''
                  signingConfig signingConfigs.release
              '''
              + s[release_insert:]
          )

          p.write_text(s)
          print("Release signing configured")
          PY

      - name: Show signing configuration
        run: |
          grep -n -A15 -B2 "signingConfigs" android/app/build.gradle || true
          grep -n -A15 -B2 "buildTypes" android/app/build.gradle || true
          grep -n "signingConfig" android/app/build.gradle || true

      - name: Clean Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/release \
            -name "*.apk" -type f | head -1)

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -1)

          echo "===== APK ====="
          echo "$APK"

          echo "===== SIGNATURE ====="
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          "$APKSIGNER" verify --verbose --print-certs "$APK" > signer.txt

          if grep -q "CN=Android Debug" signer.txt; then
            echo "ERROR: APK IS DEBUG SIGNED"
            exit 1
          fi

          echo "SUCCESS: APK IS RELEASE SIGNED"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-app-v3.4.2-fixes-1-release-apk
          path: android/app/build/outputs/apk/release/*.apk
