name: Build Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          if [ ! -s android/app/release.keystore ]; then
            echo "ERROR: Release keystore is empty"
            exit 1
          fi

      - name: Configure Release Signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: One or more signing secrets are missing"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          start = text.find("    signingConfigs {")
          build_types = text.find("    buildTypes {")

          if start == -1 or build_types == -1:
              raise SystemExit("ERROR: Could not find signingConfigs/buildTypes")

          signing_block = """    signingConfigs {
          debug {
              storeFile file('debug.keystore')
              storePassword 'android'
              keyAlias 'androiddebugkey'
              keyPassword 'android'
          }
          release {
              storeFile file('release.keystore')
              storePassword System.getenv('KEYSTORE_PASSWORD')
              keyAlias System.getenv('KEY_ALIAS')
              keyPassword System.getenv('KEY_PASSWORD')
          }
      }

      """

          text = text[:start] + signing_block + text[build_types:]

          release_start = text.find("    release {", build_types)
          if release_start == -1:
              raise SystemExit("ERROR: Could not find release build type")

          release_end = text.find("\n    }", release_start)
          if release_end == -1:
              raise SystemExit("ERROR: Could not find end of release build type")

          release_block = text[release_start:release_end]

          release_block = release_block.replace(
              "signingConfig signingConfigs.debug",
              "signingConfig signingConfigs.release"
          )

          text = text[:release_start] + release_block + text[release_end:]

          path.write_text(text)
          PY

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          APK="android/app/build/outputs/apk/release/app-release.apk"

          echo "===== APK ====="
          echo "$APK"

          echo "===== SIGNATURE ====="
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
