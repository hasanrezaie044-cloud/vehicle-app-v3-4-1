name: Build APK v3.4.2 Release

on:
  workflow_dispatch:
  push:
    branches:
      - v3.4.2-fixes-1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prebuild Android
        run: CI=1 npx expo prebuild --platform android

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is missing"; exit 1; }
          echo "All signing secrets are available."

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/carmangment-release.jks
          test -s android/app/carmangment-release.jks
          echo "Release keystore decoded successfully."

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          signing = '''    signingConfigs {
              release {
                  storeFile file("carmangment-release.jks")
                  storePassword System.getenv("KEYSTORE_PASSWORD")
                  keyAlias System.getenv("KEY_ALIAS")
                  keyPassword System.getenv("KEY_PASSWORD")
              }
          }

          '''

          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {\n" + signing, 1)

          if "signingConfig signingConfigs.release" not in s:
              marker = "buildTypes {"
              pos = s.find(marker)

              if pos == -1:
                  raise SystemExit("buildTypes block not found")

              release_pos = s.find("release {", pos)

              if release_pos == -1:
                  raise SystemExit("release build type not found")

              insert_pos = release_pos + len("release {")
              s = (
                  s[:insert_pos]
                  + "\n        signingConfig signingConfigs.release"
                  + s[insert_pos:]
              )

          p.write_text(s)
          print("Release signing configuration configured successfully.")
          PY

      - name: Verify Gradle signing configuration
        run: |
          grep -n -A10 -B2 "signingConfigs" android/app/build.gradle
          grep -n -A5 -B2 "signingConfig signingConfigs.release" android/app/build.gradle

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-app-v3.4.2-release-apk
          path: android/app/build/outputs/apk/release/*.apk
