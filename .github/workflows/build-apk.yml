name: Build APK v3.4.2-fixes-1

on:
  workflow_dispatch:
  push:
    branches:
      - v3.4.2-fixes-1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild
        run: CI=1 npx expo prebuild --platform android --non-interactive

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "Signing secrets are present"

      - name: Install release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/carmangment-release.jks
          test -s android/app/carmangment-release.jks
          chmod 600 android/app/carmangment-release.jks
          echo "Release keystore installed"

      - name: Verify release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          keytool -list \
            -keystore android/app/carmangment-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

          echo "Release keystore is valid"

      - name: Configure Gradle release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          android_start = text.find("android {")
          if android_start == -1:
              raise SystemExit("android block not found")

          buildtypes_start = text.find("buildTypes {", android_start)
          if buildtypes_start == -1:
              raise SystemExit("buildTypes block not found")

          # Insert release signing config immediately inside android {}
          signing_config = """
              signingConfigs {
                  release {
                      storeFile file("carmangment-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          text = (
              text[:android_start + len("android {")]
              + signing_config
              + text[android_start + len("android {"):]
          )

          # Recalculate buildTypes position after insertion
          buildtypes_start = text.find("buildTypes {", android_start)

          # Find the release build type
          release_start = text.find("release {", buildtypes_start)
          if release_start == -1:
              raise SystemExit("release build type not found")

          # Check whether release already has signingConfig
          release_end = text.find("}", release_start)
          release_block = text[release_start:release_end]

          if "signingConfig" not in release_block:
              insert_at = release_start + len("release {")
              text = (
                  text[:insert_at]
                  + """
                      signingConfig signingConfigs.release
                  """
                  + text[insert_at:]
              )

          path.write_text(text)

          print("Release signing configuration written successfully")
          PY

      - name: Show final Gradle signing configuration
        run: |
          echo "===== SIGNING CONFIG ====="
          grep -n -A15 -B2 "signingConfigs" android/app/build.gradle || true

          echo "===== RELEASE BUILD TYPE ====="
          grep -n -A15 -B2 "buildTypes" android/app/build.gradle || true

          echo "===== SIGNING REFERENCES ====="
          grep -n "signingConfig" android/app/build.gradle || true

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          cd android
          chmod +x gradlew

          ./gradlew clean
          ./gradlew assembleRelease

      - name: Verify APK exists
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/release \
            -name "*.apk" -type f | head -1)

          test -n "$APK"
          test -f "$APK"

          ls -lh "$APK"

      - name: Verify APK is NOT debug signed
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/release \
            -name "*.apk" -type f | head -1)

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -1)

          echo "===== APK SIGNATURE ====="
          echo "APK: $APK"
          echo "APKSIGNER: $APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK" > signer.txt

          cat signer.txt

          if grep -q "CN=Android Debug" signer.txt; then
            echo "ERROR: APK IS DEBUG SIGNED!"
            exit 1
          fi

          echo "SUCCESS: APK IS NOT DEBUG-SIGNED."

      - name: Verify APK certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/release \
            -name "*.apk" -type f | head -1)

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -1)

          "$APKSIGNER" verify --verbose --print-certs "$APK" > apk-cert.txt

          echo "===== APK CERTIFICATE ====="
          grep "certificate DN:" apk-cert.txt
          grep "certificate SHA-256 digest:" apk-cert.txt

          echo "===== RELEASE KEYSTORE CERTIFICATE ====="

          keytool -list -v \
            -keystore android/app/carmangment-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > keystore-cert.txt

          grep "Owner:" keystore-cert.txt
          grep "SHA256:" keystore-cert.txt

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-app-v3.4.2-fixes-1-release-apk
          path: android/app/build/outputs/apk/release/*.apk
